name: Sovereign APK Forge CI
on: [push, pull_request]
jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Android SDK cmdline-tools
        run: |
          sudo apt-get install -y unzip zip
          echo "ANDROID_HOME=$ANDROID_HOME"
      - name: No-ads audit
        run: ./tests/test-no-ads.sh
      - name: Syntax check all scripts
        run: for f in scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done
      - name: Build template (smoke)
        run: ./scripts/build-apk.sh template/ dist/ || echo "build-tools not in CI — expected"
      - name: Upload build manifest
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: forge-output, path: dist/, retention-days: 7 }
